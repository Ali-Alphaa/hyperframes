<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>HyperFrames Studio</title>
<style>
  :root { --bg: #0d0e11; --panel: #16181d; --line: #262931; --text: #e8eaf0; --dim: #8b90a0; --accent: #4f8cff; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 "Segoe UI", system-ui, sans-serif; }
  main { max-width: 980px; margin: 0 auto; padding: 40px 32px 60px; }
  header { display: flex; align-items: center; gap: 16px; margin-bottom: 28px; }
  h1 { font-size: 22px; font-weight: 600; margin: 0; flex: 1; }
  h2 { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); margin: 28px 0 10px; }
  input { width: 280px; background: var(--panel); border: 1px solid var(--line); color: var(--text); border-radius: 8px;
    padding: 9px 12px; font: inherit; outline: none; }
  input:focus { border-color: var(--accent); }
  button.other { background: transparent; border: 1px solid var(--line); color: var(--text); border-radius: 8px;
    padding: 9px 14px; font: inherit; cursor: pointer; }
  button.other:hover { border-color: var(--dim); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; cursor: pointer;
    text-align: left; color: inherit; font: inherit; transition: border-color .12s, transform .12s; }
  .card:hover, .card:focus-visible { border-color: var(--accent); outline: none; transform: translateY(-1px); }
  .name { font-size: 15px; font-weight: 600; margin-bottom: 4px; word-break: break-word; }
  .meta { color: var(--dim); font-size: 12px; word-break: break-all; }
  .empty { color: var(--dim); padding: 30px 0; }
  #busy { position: fixed; inset: 0; background: rgba(13,14,17,.88); display: none; align-items: center; justify-content: center;
    flex-direction: column; gap: 14px; font-size: 15px; }
  #busy.on { display: flex; }
  .spin { width: 28px; height: 28px; border: 3px solid var(--line); border-top-color: var(--accent); border-radius: 50%;
    animation: s 0.8s linear infinite; }
  @keyframes s { to { transform: rotate(360deg); } }
  #error { display: none; background: #2a1517; border: 1px solid #5c2a2f; color: #ffb4b9; border-radius: 8px; padding: 10px 14px;
    margin-bottom: 16px; white-space: pre-wrap; }
  .hint { color: var(--dim); font-size: 12px; margin-top: 36px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>HyperFrames</h1>
    <input id="q" placeholder="Search projects" autofocus>
    <button class="other" id="other">Other folder…</button>
  </header>
  <div id="error"></div>
  <div id="list"></div>
  <p class="hint">Tip: press Alt+← in Studio to come back here and open another project.</p>
</main>
<div id="busy"><div class="spin"></div><div id="busyText">Opening…</div></div>
<script>
  const list = document.getElementById("list"), q = document.getElementById("q");
  let projects = [];

  const ago = (ms) => {
    if (!ms) return "";
    const d = (Date.now() - ms) / 86400000;
    if (d < 1 / 24) return "edited just now";
    if (d < 1) return `edited ${Math.round(d * 24)} h ago`;
    if (d < 30) return `edited ${Math.round(d)} day${Math.round(d) === 1 ? "" : "s"} ago`;
    return "edited " + new Date(ms).toLocaleDateString();
  };

  function card(p) {
    const b = document.createElement("button");
    b.className = "card";
    b.innerHTML = `<div class="name"></div><div class="meta"></div><div class="meta"></div>`;
    b.children[0].textContent = p.name;
    b.children[1].textContent = ago(p.edited);
    b.children[2].textContent = p.folder;
    b.onclick = () => open("/open", { dir: p.dir }, p.name);
    return b;
  }

  function section(title, items) {
    if (!items.length) return;
    const h = document.createElement("h2");
    h.textContent = title;
    const g = document.createElement("div");
    g.className = "grid";
    items.forEach((p) => g.appendChild(card(p)));
    list.append(h, g);
  }

  function render() {
    const term = q.value.trim().toLowerCase();
    const shown = projects.filter((p) => !term || (p.name + " " + p.folder).toLowerCase().includes(term));
    list.innerHTML = "";
    const recent = shown.filter((p) => p.recent >= 0).sort((a, b) => a.recent - b.recent);
    const rest = shown.filter((p) => p.recent < 0).sort((a, b) => b.edited - a.edited);
    section("Recent", recent);
    section(recent.length ? "All projects" : "Projects", rest);
    if (!shown.length) list.innerHTML = `<div class="empty">No projects found${term ? " for “" + q.value + "”" : ""}. Use “Other folder…” to open one.</div>`;
  }

  async function open(path, body, name) {
    const err = document.getElementById("error");
    err.style.display = "none";
    document.getElementById("busyText").textContent = name ? `Opening ${name}…` : "Choose a project in the Explorer window…";
    document.getElementById("busy").classList.add("on");
    try {
      const r = await fetch(path, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body || {}) });
      const data = await r.json();
      if (data.url) { location.href = data.url; return; }
      if (!data.cancelled) throw new Error(data.error || "Studio didn't start.");
    } catch (e) {
      err.textContent = e.message;
      err.style.display = "block";
    }
    document.getElementById("busy").classList.remove("on");
  }

  document.getElementById("other").onclick = () => open("/browse");
  q.oninput = render;
  q.onkeydown = (e) => { if (e.key === "Enter") list.querySelector(".card")?.click(); };
  window.addEventListener("pageshow", () => document.getElementById("busy").classList.remove("on"));
  fetch("/projects").then((r) => r.json()).then((p) => { projects = p; render(); });
</script>
</body>
</html>
